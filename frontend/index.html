<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPES - Economic Simulation Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto 1fr 300px;
            gap: 20px;
            padding: 20px;
            height: 100vh;
        }

        .header {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2em;
            background: linear-gradient(to right, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats {
            display: flex;
            gap: 30px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .agent-grid {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .agent-grid h2 {
            margin-bottom: 15px;
        }

        .grid-canvas {
            position: relative;
            width: 100%;
            height: calc(100% - 50px);
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .agent {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #4facfe, #00f2fe);
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .agent:hover {
            transform: scale(1.5);
            box-shadow: 0 0 20px rgba(79, 172, 254, 1);
        }

        .agent.trading {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .orderbook {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            overflow-y: auto;
        }

        .orderbook h2 {
            margin-bottom: 15px;
        }

        .commodity-book {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .commodity-book h3 {
            margin-bottom: 10px;
            color: #4facfe;
        }

        .order-side {
            margin-bottom: 10px;
        }

        .order-side h4 {
            font-size: 0.9em;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .order {
            display: flex;
            justify-content: space-between;
            padding: 5px 10px;
            margin: 3px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            font-size: 0.85em;
        }

        .order.bid {
            border-left: 3px solid #00ff88;
        }

        .order.ask {
            border-left: 3px solid #ff4444;
        }

        .charts {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
        }

        .chart-container {
            position: relative;
            height: 250px;
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            font-size: 0.9em;
        }

        .connection-status.connected {
            background: rgba(0, 255, 136, 0.3);
        }

        .connection-status.disconnected {
            background: rgba(255, 68, 68, 0.3);
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">Connecting...</div>
    
    <div class="container">
        <div class="header">
            <h1>🌐 MPES Economic Simulation</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="tickCount">0</div>
                    <div class="stat-label">Tick</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="tradeCount">0</div>
                    <div class="stat-label">Trades</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgWealth">$0</div>
                    <div class="stat-label">Avg Wealth</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="giniCoef">0.000</div>
                    <div class="stat-label">Gini</div>
                </div>
            </div>
        </div>

        <div class="agent-grid">
            <h2>👥 Agent Activity</h2>
            <div class="grid-canvas" id="agentGrid"></div>
        </div>

        <div class="orderbook">
            <h2>📊 Order Book</h2>
            <div id="orderbookContent"></div>
        </div>

        <div class="charts">
            <h2>📈 Price History</h2>
            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        // WebSocket connection
        let ws = null;
        let reconnectInterval = null;
        
        // Data storage
        let priceHistory = {
            labels: [],
            datasets: {}
        };
        
        // Chart instance
        let priceChart = null;

        // Connect to WebSocket server
        function connect() {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.textContent = 'Connecting...';
            statusEl.className = 'connection-status';

            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = () => {
                console.log('Connected to simulation');
                statusEl.textContent = '🟢 Connected';
                statusEl.className = 'connection-status connected';
                
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'tick_update') {
                    updateVisualization(message.data);
                } else if (message.type === 'initial_state') {
                    updateVisualization(message.data);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('Disconnected from simulation');
                statusEl.textContent = '🔴 Disconnected';
                statusEl.className = 'connection-status disconnected';
                
                // Attempt to reconnect
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(() => {
                        console.log('Attempting to reconnect...');
                        connect();
                    }, 3000);
                }
            };
        }

        // Update visualization with new data
        function updateVisualization(data) {
            updateStats(data);
            updateAgentGrid(data);
            updateOrderBook(data);
            updatePriceChart(data);
        }

        // Update statistics
        function updateStats(data) {
            document.getElementById('tickCount').textContent = data.tick || 0;
            document.getElementById('tradeCount').textContent = data.total_trades || 0;
            document.getElementById('avgWealth').textContent = 
                '$' + (data.avg_wealth || 0).toFixed(2);
            document.getElementById('giniCoef').textContent = 
                (data.gini_coefficient || 0).toFixed(3);
        }

        // Update agent grid
        function updateAgentGrid(data) {
            const gridEl = document.getElementById('agentGrid');
            
            // Create agents if they don't exist
            if (gridEl.children.length === 0 && data.agents) {
                data.agents.forEach(agent => {
                    const agentEl = document.createElement('div');
                    agentEl.className = 'agent';
                    agentEl.id = `agent-${agent.id}`;
                    agentEl.style.left = `${Math.random() * 90}%`;
                    agentEl.style.top = `${Math.random() * 90}%`;
                    
                    agentEl.addEventListener('mouseenter', (e) => {
                        showTooltip(e, agent);
                    });
                    
                    agentEl.addEventListener('mouseleave', hideTooltip);
                    
                    gridEl.appendChild(agentEl);
                });
            }

            // Animate trading agents
            if (data.recent_traders) {
                data.recent_traders.forEach(agentId => {
                    const agentEl = document.getElementById(`agent-${agentId}`);
                    if (agentEl) {
                        agentEl.classList.add('trading');
                        setTimeout(() => {
                            agentEl.classList.remove('trading');
                        }, 1000);
                    }
                });
            }
        }

        // Update order book
        function updateOrderBook(data) {
            const orderbookEl = document.getElementById('orderbookContent');
            
            if (!data.market_stats) return;

            let html = '';
            for (const [commodity, stats] of Object.entries(data.market_stats)) {
                html += `
                    <div class="commodity-book">
                        <h3>${commodity.toUpperCase()}</h3>
                        <div class="order-side">
                            <h4>ASKS (Sell Orders)</h4>
                            ${stats.num_asks > 0 ? 
                                `<div class="order ask">
                                    <span>Best Ask:</span>
                                    <span>$${(stats.best_ask || 0).toFixed(2)}</span>
                                </div>` :
                                '<div class="order">No asks</div>'
                            }
                        </div>
                        <div class="order-side">
                            <h4>BIDS (Buy Orders)</h4>
                            ${stats.num_bids > 0 ? 
                                `<div class="order bid">
                                    <span>Best Bid:</span>
                                    <span>$${(stats.best_bid || 0).toFixed(2)}</span>
                                </div>` :
                                '<div class="order">No bids</div>'
                            }
                        </div>
                        <div style="margin-top: 10px; font-size: 0.85em; opacity: 0.8;">
                            Spread: $${(stats.spread || 0).toFixed(2)} | 
                            Last: $${(stats.last_trade_price || 0).toFixed(2)}
                        </div>
                    </div>
                `;
            }
            
            orderbookEl.innerHTML = html;
        }

        // Update price chart
        function updatePriceChart(data) {
            if (!data.avg_prices) return;

            // Initialize chart if needed
            if (!priceChart) {
                const ctx = document.getElementById('priceChart').getContext('2d');
                priceChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: []
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: false,
                                ticks: { color: '#fff' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            },
                            x: {
                                ticks: { color: '#fff' },
                                grid: { color: 'rgba(255, 255, 255, 0.1)' }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { color: '#fff' }
                            }
                        }
                    }
                });
            }

            // Update data
            priceChart.data.labels.push(data.tick);
            
            const colors = {
                grain: 'rgb(255, 206, 86)',
                iron: 'rgb(153, 102, 255)',
                wood: 'rgb(75, 192, 192)',
                stone: 'rgb(255, 99, 132)'
            };

            for (const [commodity, price] of Object.entries(data.avg_prices)) {
                let dataset = priceChart.data.datasets.find(d => d.label === commodity);
                
                if (!dataset) {
                    dataset = {
                        label: commodity,
                        data: [],
                        borderColor: colors[commodity] || 'rgb(200, 200, 200)',
                        backgroundColor: 'transparent',
                        tension: 0.4
                    };
                    priceChart.data.datasets.push(dataset);
                }
                
                dataset.data.push(price || 0);
            }

            // Limit to last 50 ticks
            if (priceChart.data.labels.length > 50) {
                priceChart.data.labels.shift();
                priceChart.data.datasets.forEach(dataset => {
                    dataset.data.shift();
                });
            }

            priceChart.update('none'); // Update without animation for performance
        }

        // Tooltip functions
        function showTooltip(event, agent) {
            const tooltip = document.getElementById('tooltip');
            tooltip.innerHTML = `
                <strong>${agent.id}</strong><br>
                Wealth: $${(agent.wallet || 0).toFixed(2)}<br>
                Utility: ${(agent.utility || 0).toFixed(2)}
            `;
            tooltip.style.display = 'block';
            tooltip.style.left = event.pageX + 10 + 'px';
            tooltip.style.top = event.pageY + 10 + 'px';
        }

        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        // Initialize
        connect();
    </script>
</body>
</html>
